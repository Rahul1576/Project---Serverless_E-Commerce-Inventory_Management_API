<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CloudMart Store</title>
    <style>
        :root {
            --primary: #232f3e;
            --accent: #ff9900;
            --bg: #f4f6f8;
            --card-bg: #ffffff;
            --text: #111827;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        header {
            background: var(--primary);
            color: white;
            padding: 20px 30px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        header h1 { margin: 0; font-size: 24px; }
        
        .header-actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            background: var(--accent);
            color: #111;
            border: none;
            padding: 10px 18px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            text-decoration: none;
        }

        .btn:hover { background: #e68a00; }

        .btn-outline {
            background: transparent;
            color: white;
            border: 1px solid white;
        }

        .btn-outline:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* Customer Search */
        .controls {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-bar {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
        }

        /* Product Cards Grid */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .card h4 { margin: 0 0 10px 0; font-size: 18px; text-transform: capitalize; }
        .card .price { font-size: 22px; font-weight: bold; color: #007600; margin-bottom: 10px; }
        
        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            width: fit-content;
        }

        .in-stock { background: #e6f4ea; color: #137333; }
        .low-stock { background: #fce8e6; color: #c5221f; }
        .item-id { font-size: 12px; color: #666; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>☁️ CloudMart Store Portal</h1>
        <div class="header-actions">
            <button class="btn btn-outline" onclick="fetchInventory()">🔄 Refresh Data</button>
            <a href="admin.html" class="btn">🔐 Owner Login</a>
        </div>
    </header>

    <!-- CUSTOMER SEARCH -->
    <div class="controls">
        <input type="text" id="searchInput" class="search-bar" placeholder="🔍 Search products by name..." onkeyup="filterProducts()">
    </div>

    <!-- PRODUCTS DISPLAY -->
    <div id="productGrid" class="product-grid">
        <!-- Dynamic Cards Will Render Here -->
    </div>
</div>

<script>
    // Replace with your API Gateway Stage URL
    const API_URL = "https://8is36xmyuc.execute-api.us-east-1.amazonaws.com/prod/items";

    let rawInventoryData = [];

    async function fetchInventory() {
        try {
            const res = await fetch(API_URL);
            rawInventoryData = await res.json();
            renderProducts(rawInventoryData);
        } catch (err) {
            alert("Error fetching inventory: " + err);
        }
    }

    function renderProducts(items) {
        const container = document.getElementById('productGrid');
        container.innerHTML = '';

        if (!items || items.length === 0) {
            container.innerHTML = '<p>No products found in store.</p>';
            return;
        }

        items.forEach(item => {
            const isLowStock = item.stock < 10;
            const badgeClass = isLowStock ? 'low-stock' : 'in-stock';
            const badgeText = isLowStock ? `Only ${item.stock} left!` : `In Stock: ${item.stock}`;

            const cardHtml = `
                <div class="card">
                    <div>
                        <h4>${item.name}</h4>
                        <div class="price">$${item.price}</div>
                        <span class="badge ${badgeClass}">${badgeText}</span>
                    </div>
                    <div class="item-id">ID: ${item.itemId}</div>
                </div>
            `;
            container.innerHTML += cardHtml;
        });
    }

    function filterProducts() {
        const searchTerm = document.getElementById('searchInput').value.toLowerCase();
        const filtered = rawInventoryData.filter(item => 
            item.name.toLowerCase().includes(searchTerm)
        );
        renderProducts(filtered);
    }

    window.onload = fetchInventory;
</script>

</body>
</html>
